name: Aliena
description: Aliena is a Singapore-based space-technology company, incorporated in 2018, that designs
  and manufactures compact electric propulsion systems for small satellites. Its MUSIC plasma thruster
  line delivers high thrust-to-power ratios at very low power budgets with high specific impulse, enabling
  small satellites to operate and sustain very low Earth orbit (VLEO) for high-resolution remote sensing.
  Aliena is a hardware manufacturer with no public developer API, SDK, or developer portal; this API
  Evangelist profile tracks the company as a 500 Global portfolio lead.
